[project]
name = "flybrain-lab"
version = "0.2.0"
description = "An original experimental simulator for the FlyWire v783 connectome"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
gpu = ["torch>=2.8,<3"]

[project.scripts]
flybrain = "flybrain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flybrain"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
